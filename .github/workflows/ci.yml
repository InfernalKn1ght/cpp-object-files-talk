name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  # Default compiler env vars (overridden if set on the runner)
  CXX: clang++
  RUSTC: rustc
  ZIG: zig

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            clang \
            rustc \
            binutils \
            gcc
      
      - name: Install Zig
        uses: mlugg/setup-zig@v1

      - name: Install Rust target (x86_64)
        run: rustup target add x86_64-unknown-linux-gnu

      - name: Build all (make all)
        run: make all

      - name: Upload results artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-results
          path: results/
          retention-days: 30